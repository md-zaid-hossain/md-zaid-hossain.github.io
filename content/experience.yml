training:
- when: SEP 2025
  title: CNC and CAM on a HAAS VF-2 milling machine
  org: Department of IEM, KUET
  text: 'Hands-on training when the department''s HAAS VF-2 and desktop lathe came in: machine operation, tool holders and offsets, graphical
    simulation and shop-floor safety. I modelled a test part, planned its face, pocket, drill and adaptive toolpaths in Fusion CAM, posted the
    NC program and cut it in aluminium.'
  photos: cnc
- when: APR 2025
  title: International SOLIDWORKS Bootcamp 2025
  org: ASME QUEST Chapter with the Islamabad SOLIDWORKS User Group (ISUG) and the SOLIDWORKS MUET Club · online
  text: 'An international online bootcamp on advanced part and assembly modelling, simulation (FEA), surface and hybrid modelling, design for
    manufacturing and engineering drawings. I completed all five graded tasks: sketching with draft angles and fillets, a stress and displacement
    study, a flange with its 2D drawing, hybrid surface and solid modelling, and a multi-body part with mass checks.'
  photos: bootcamp
