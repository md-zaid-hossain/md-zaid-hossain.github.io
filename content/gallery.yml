- chapter: making
  label: MAKING
  subtitle: Hands on the machines
  albums:
  - key: a1
    code: GAL-A1
    title: Bringing the CR-10 Smart back to life
    place: FabLab KUET
    date: MAY 2025
    story: The lab's Creality CR-10 Smart had been down for a long time with a damaged thermistor and extruder. A compatible extruder set came
      from China through KUET alumnus Nahid Al Mahmud. I replaced the parts, rewired the connectors, aligned the hotend with the Bowden tube and
      tested it until it printed smoothly again.
    photos:
    - image: media/gallery/a1-1.webp
      caption: The new extruder set, fan and wiring, unpacked
      focus: 50% 35%
      id: a1-1
    - image: media/gallery/a1-2.webp
      caption: The old wiring inside the printer, traced connector by connector
      focus: 50% 35%
      id: a1-2
    - image: media/gallery/a1-3.webp
      caption: Fitting the new extruder on the carriage
      focus: 50% 35%
      id: a1-3
    - image: media/gallery/a1-4.webp
      caption: Lining up the hotend with the Bowden tube
      focus: 50% 35%
      id: a1-4
    - image: media/gallery/a1-5.webp
      caption: Final checks before the first test print
      focus: 50% 35%
      id: a1-5
  - key: a2
    code: GAL-A2
    title: From CAD to a printed part
    place: FabLab KUET
    date: 2024 TO 2025
    story: 'Small parts I designed in SOLIDWORKS, sliced, printed on the lab''s Creality CR-10 Smart and Ultimaker 3 Extended, then finished by
      hand: a quick acting knob, a vice for accurate alignment, a hand spinning top and a 3-2-1 pin locator.'
    photos:
    - image: media/gallery/a2-1.webp
      caption: Quick acting knob, the finished part on its drawing
      focus: 50% 50%
      id: a2-1
    - image: media/gallery/a2-2.webp
      caption: The knob printing on the CR-10 Smart
      focus: 50% 50%
      id: a2-2
    - image: media/gallery/a2-3.webp
      caption: Breaking away the support material
      focus: 50% 50%
      id: a2-3
    - image: media/gallery/a2-4.webp
      caption: Knob and screw after post-processing
      focus: 50% 50%
      id: a2-4
    - image: media/gallery/a2-5.webp
      caption: Vice for accurate alignment, assembled
      focus: 50% 50%
      id: a2-5
    - image: media/gallery/a2-6.webp
      caption: 'The vice from above: screw, sliding jaw and handle'
      focus: 50% 50%
      id: a2-6
    - image: media/gallery/a2-7.webp
      caption: Hand spinning top, printed on the Ultimaker
      focus: 50% 50%
      id: a2-7
    - image: media/gallery/a2-8.webp
      caption: The top on the build plate, before the supports came off
      focus: 50% 50%
      id: a2-8
    - image: media/gallery/a2-9.webp
      caption: First layers going down
      focus: 50% 50%
      id: a2-9
    - image: media/gallery/a2-10.webp
      caption: 3-2-1 pin locator for the Tool Engineering sessional
      focus: 50% 50%
      id: a2-10
  - key: a5
    code: GAL-A3
    title: First part on the HAAS VF-2
    place: Dept. of IEM, KUET
    date: SEP 2025
    story: The department installed a HAAS VF-2 milling machine and a CNC table lathe, followed by a five-day hands-on training with HAAS, led
      by Mr. Sunil Patil. I modelled a test part, planned its toolpaths in Fusion CAM, posted the NC program and, for the first time, saw my own
      design cut in aluminium.
    photos:
    - image: media/exp/exp-cnc-01-fusion-machine.webp
      caption: 'Plan: HAAS VF-2 set up as the machine in Fusion CAM'
      focus: 50% 50%
    - image: media/exp/exp-cnc-02-cam-simulation.webp
      caption: 'Plan: Toolpath simulation: face, pockets, drills, adaptive clearing'
      focus: 50% 50%
    - image: media/exp/exp-cnc-03-nc-program.webp
      caption: 'Plan: The posted NC program for the VF-2'
      focus: 50% 50%
    - image: media/exp/exp-cnc-04-vf2-vise.webp
      caption: 'Set up: The VF-2 with the vise on the table'
      focus: 50% 50%
    - image: media/exp/exp-cnc-05-bt40-holder.webp
      caption: 'Set up: BT40 tool holder'
      focus: 50% 50%
    - image: media/exp/exp-cnc-07-control-running.webp
      caption: 'Run: The program running on the HAAS control'
      focus: 50% 50%
    - image: media/exp/exp-cnc-08-face-milling.webp
      caption: 'Cut: Face milling the stock'
      focus: 50% 50%
    - image: media/exp/exp-cnc-09-coolant-cut.webp
      caption: 'Cut: Pocketing with flood coolant'
      focus: 50% 50%
    - image: media/exp/exp-cnc-10-small-end-mill.webp
      caption: 'Cut: Detail work with the small end mill'
      focus: 50% 50%
    - image: media/exp/exp-cnc-10b-unclamp-part.webp
      caption: 'Result: Taking the cut part out of the vise'
      focus: 50% 50%
    - image: media/exp/exp-cnc-11-finished-part.webp
      caption: 'Result: The finished aluminium part'
      focus: 50% 50%
    - image: media/exp/exp-cnc-12-with-part.webp
      caption: 'Result: With the part at the machine'
      focus: 50% 50%
