  - key: d2
    code: GAL-D1
    title: Special session on BRACU FabLab
    place: BRAC University Research Conference 2026 · Central Auditorium, Dhaka
    date: 14 NOV 2026
    story: The BRAC University Silver Jubilee Research Conference 2026 held a special session on BRACU FabLab, with the Project Director of the
      HEAT Project, UGC, as chief guest. FabLab teams from the universities funded under HEAT talked about building a FabLab network across universities.
      I attended with the BUET FabLab team, at the invitation of BRACU FabLab.
    credit: 'Photos: BRACU FabLab'
