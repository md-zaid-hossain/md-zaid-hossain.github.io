  title: A simulation-based context-aware multimodal ML framework for proactive worker safety monitoring in resource-constrained factories
  venue: Array 31 (2026) 101198 · Elsevier · open access
  authors: Nasif Morshed, Md. Saiful Islam Seam, Md. Zaid Hossain, Md Al Amin
  doi: 10.1016/j.array.2026.101198
  metric:
    value: '5.3'
    label: '10.1'
  q: Can a low-cost design that joins several kinds of factory data flag unsafe situations early, in factories with little money for safety technology?
  m: One decision design joins environmental sensors, camera-based PPE detection (YOLOv8, proposed), RFID zone tracking and incident history,
    with a rule table and a supervisor review step. Six classifiers on 300 simulated observations, cross-validation plus a held-out test, and
    an ablation by data source.
  f: 'The classifiers learned the expert safety policy well: Random Forest and XGBoost both reached 0.833 accuracy on the held-out set. Sensor
    and zone data carried most of the signal. Real-factory validation is the next step.'
  nums:
  - value: '300'
    label: simulated observations
  - value: '6'
    label: classifiers
  - value: '0.833'
    label: held-out accuracy
  - value: '4'
    label: data sources
  how: array1
  howcap: FIG. 1 · Workflow of the proposed multimodal safety monitoring framework
  fig: array5
  figcap: 'FIG. 5 · Ablation by data source: weighted F1 for each sensor mix'
  look: Sensor and zone data (fifth bar) are almost as good as all data together (green).
  abstract: Occupational safety monitoring in resource-constrained factories remains dominated by manual and reactive inspection. This study presents
    a simulation-based proof-of-concept evaluation of a context-aware safety decision architecture that integrates three sensing modalities (environmental
    measurements, proposed image-based PPE detection, and RFID zone tracking) together with incident-history context, an explicit rule table,
    and a designed human-in-the-loop (HITL) review layer. The evaluation uses 300 simulated observations. Because the target classes were generated
    by the same expert-defined rule table that maps sensor risk, PPE status, and zone level to No Alert, Warning, or High Risk, the supervised
    classifiers approximate that policy rather than predict independently observed accidents. Six classifiers were compared using stratified cross-validation
    and a held-out test partition. At the original seed-42 split, Random Forest and XGBoost produced identical held-out results (accuracy and
    weighted F1 = 0.833; macro F1 = 0.829; balanced accuracy = 0.800; Cohen's kappa = 0.718; High-Risk recall = 0.700). A supplementary reconstructed
    fixed-dataset analysis across seeds 0, 1, 42, 123, and 999 yielded held-out weighted F1 of 0.836±0.022 for Random Forest and 0.859±0.027 for
    XGBoost. Across five seed-level cross-validation means, the Full and Sensor + Zone configurations differed by only 0.003±0.012 weighted F1,
    with no significant difference detected in an exploratory paired test (W = 5.0, p = 0.625). The proposed YOLOv8 and HITL components were not
    empirically validated. The results therefore demonstrate policy-approximation feasibility under simulation and identify sensor and zone information
    as the dominant contributors, while real-factory validation remains essential.
