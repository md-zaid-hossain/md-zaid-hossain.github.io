  title: Leakage-controlled machine learning for work-related musculoskeletal disorder risk classification among garment sewing-machine operators
  venue: Results in Engineering 32 (2026) 113789 · Elsevier · open access
  authors: Md. Zaid Hossain, Md. Golam Kibria, Borhan Ul Arif, Shahriar Hasan Ratul
  doi: 10.1016/j.rineng.2026.113789
  metric:
    value: '9.4'
    label: '8.8'
  q: Can posture scores taken from task videos, together with worker data, sort sewing operators into low, medium and high WMSD risk without the
    outcome leaking into the model?
  m: Bilateral task videos of 60 operators, frame-wise joint angles turned into time-weighted RULA scores. A modified Nordic questionnaire gave
    the SEP-based MSD Index used as the label. Eight classifiers in ten repeats of nested stratified five-fold cross-validation, with all preprocessing
    and tuning inside the training folds.
  f: 'Gradient-boosted trees did best: balanced accuracy 0.940, MCC 0.906. Non-postural variables carried most of the signal. An internal proof
    of concept that still needs external validation.'
  nums:
  - value: '60'
    label: operators
  - value: '8'
    label: classifiers
  - value: '0.940'
    label: balanced accuracy
  - value: 91.7%
    label: report neck pain
  video: video
  vidcap: Two-camera recording of a sewing task with joint-angle markers, faces blurred
  how: wmsd1
  howcap: FIG. 1 · Leakage-controlled WMSD risk-classification workflow
  fig: wmsd10
  figcap: FIG. 10 · Mean balanced accuracy of the eight classifiers
  look: Gradient-boosted trees (top bar) scored highest, but most classifiers are close.
  abstract: Work-related musculoskeletal disorders (WMSDs) impose a substantial occupational-health burden in labour-intensive industries, while
    practical tools for systematic workplace risk stratification remain limited. This cross-sectional study developed and internally evaluated
    a leakage-controlled machine-learning framework using 60 analytical records from Bangladeshi garment sewing-machine operators. Bilateral task
    videos were processed through a semi-automated workflow to derive time-weighted Rapid Upper Limb Assessment (RULA) scores. A modified Nordic
    Musculoskeletal Questionnaire was used to calculate the Severity-Exposure-Probability (SEP)-based MSD Index, which defined low-, medium-,
    and high-risk strata. Eight classifiers were evaluated using ten repeats of nested stratified five-fold cross-validation, with preprocessing
    and hyperparameter tuning restricted to training partitions. Gradient-boosted trees had the highest observed mean balanced accuracy among
    the eight classifiers, with repeat-level mean accuracy of 0.950 (95 % CI 0.928 to 0.972), balanced accuracy of 0.940 (0.909 to 0.971), macro-F1
    of 0.951 (0.925 to 0.977), and MCC of 0.906 (0.863 to 0.949). Among the Holm-adjusted paired comparisons, only the comparison between gradient-boosted
    trees and k-nearest neighbours remained significant; the other six comparisons with gradient-boosted trees were not significant. Non-postural
    variables yielded numerically higher mean performance than the combined feature set (difference not formally tested), while postural variables
    alone provided moderate discrimination; consequently, an incremental classification benefit from adding dynamic RULA was not demonstrated.
    These internal proof-of-concept findings, based on a Low-risk class of only six records, require external validation before deployment or
    population-level performance claims; the present implementation is offline and semi-automated, and a real-machine computational benchmark
    remains outstanding.
