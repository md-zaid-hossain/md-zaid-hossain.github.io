  title: 'AI-Driven Early Warning System for Industrial Shutdowns on High-Risk Pollution Days: A Case Study on Dhaka Air Quality'
  venue: 2025 IEEE QPAIN · BAUST, Saidpur, Bangladesh · 31 Jul to 2 Aug 2025
  authors: Md. Zaid Hossain, Nasif Morshed, Md. Saiful Islam Seam
  doi: 10.1109/QPAIN66474.2025.11171883
  metric: null
  q: Can machine learning predict high-risk pollution days in Dhaka early enough for authorities to plan industrial shutdowns?
  m: Air-quality data from 2000 to 2025 (SO₂, NO₂, O₃, CO, PM2.5, PM10, temperature, humidity). Seven models built and compared in RapidMiner
    Studio with 10-fold cross-validation.
  f: Random Forest was best, with 98.34% accuracy and R² 0.921. Pollution peaks in the cooler, drier months; the forecast feeds an industry-specific
    shutdown protocol.
  nums:
  - value: '25'
    label: years of data
  - value: '7'
    label: models
  - value: 98.34%
    label: accuracy
  - value: '0.921'
    label: R²
  how: qpain1
  howcap: FIG. 1 · Workflow diagram
  fig: qpain6
  figcap: FIG. 6 · Accuracy (%) of the seven models
  look: Random Forest and Gradient Boosted Trees score highest, at 98.34%.
  abstract: Rapid urbanization and industrial activities, coupled with a failure by policymakers and governance agencies to address air pollution,
    has led to a pressing yet urgent and proactive need for immediate action to tackle the continuous air pollution crisis in Dhaka. The goal
    of this study is to create an AI-based early warning system to predict high risk pollution days and recommend industrial shutdowns as a measure
    of lowering exposure. With a dataset spanning 2000 to 2025, the seven machine learning models implement data points including SO₂, NO₂, O₃,
    CO, PM2.5, PM10, Temperature, and Humidity on Decision Tree, Random Forest, Gradient Boosted Trees, k-NN, AdaBoost, Support Vector Machine
    (SVM), and Linear Regression. RapidMiner Studio was chosen to perform a 10-fold cross validation process to evaluate model. The best performance
    was achieved by Random Forest model with accuracy of 98.34% and R² value of 0.921 among all. The reason for the pollution peak were the cooler
    and drier months. The proposed system delivers authorities a practical solution to back their public health risk reduction decisions using
    industry-specific shutdown protocols. The solution brings its technology to intense air quality challenges in urban areas through the use
    of predictive insights for generating policy-triggered action plans.
