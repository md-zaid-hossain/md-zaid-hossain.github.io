  title: 'SOP-Driven Improvements in Efficiency, Quality and On-Time Delivery: Evidence from Bangladesh''s RMG Sewing Industry'
  venue: 8th IEOM Bangladesh International Conference · Dhaka · 20 to 21 Dec 2025 · IEOM Society
  authors: Md. Tanjid Hossen Irfan, Md. Ismail Hossain, Md. Zaid Hossain, Nasif Morshed, Md. Saiful Islam Seam
  doi: 10.46254/BA08.20250288
  metric: null
  pdf: https://ieomsociety.org/proceedings/bangladesh2025/288.pdf
  q: What changes on the sewing floor of a large Bangladeshi RMG factory when the lines run on standard operating procedures alone, without a
    wider quality framework?
  m: One month before (July) and one month after (August) SOP go-live on the sewing lines. Daily efficiency, performance, non-production time
    (NPT), defects per hundred units (DHU) and handover on time (HOT), tested at p &lt; 0.05.
  f: Line efficiency rose from 67.9% to 77.9%, NPT fell from 32% to 22.05%, DHU from 9.96% to 5.21%, and handover on time reached 100%. One factory
    and the sewing section only, with no control group.
