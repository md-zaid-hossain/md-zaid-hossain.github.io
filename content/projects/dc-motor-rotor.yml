lead: 'The armature of a small DC motor, modelled as one detailed part in SOLIDWORKS: the laminated core, the copper windings and the commutator
  on its shaft. A month later it went into a full motor with housing, magnets, brush holders and a pinion, and both were rendered in KeyShot.'
