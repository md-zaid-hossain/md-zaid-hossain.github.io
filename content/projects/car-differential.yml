sections:
- kind: clip
  tag: HOW IT WORKS
  title: What a differential does
  text: 'In a corner the outer wheel travels further than the inner one. The differential lets the two output shafts turn at different speeds
    while both still get drive: the bevel gears inside the housing roll around each other instead of locking the shafts together. In the clip
    the housing fades out so the gears inside can be seen.'
  video: media/proj_differential/cover-fade.mp4
  poster: media/proj_differential/cover-fade-poster.jpg
  cap: KEYSHOT · HOUSING FADES OUT · 5.5 S
  wide: true
- kind: clip
  tag: MOTION STUDY
  title: Taken apart and put back
  text: 'SOLIDWORKS Motion Study 1: the coupling, the housing and its six flange bolts move out along the shaft axis, then the assembly closes
    again. A rotary motor is set up in the same study to turn the gears.'
  video: media/proj_differential/motion-study.mp4
  poster: media/proj_differential/motion-study-poster.jpg
  cap: SOLIDWORKS · MOTION STUDY 1 · 22 S
