lead: A phone stand where a curved rack holder sits in a toothed base, so the phone can be set upright or tilted back. The idea comes from an
  open design on Thingiverse; I modelled my own version in SOLIDWORKS, added my Z mark and a personalised version for a friend, sliced it in Creality
  Print and printed it on an Ender-3 V2 Neo.
