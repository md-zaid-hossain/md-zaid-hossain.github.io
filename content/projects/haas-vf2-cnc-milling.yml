lead: 'When the department installed a HAAS VF-2 milling machine, HAAS ran a five-day hands-on training. I modelled a test plate, planned its
  toolpaths in Fusion CAM, posted the NC program for the VF-2 and cut the part in aluminium: the first design of mine to come off a CNC machine.
  The CAM steps were the ones I had practised in simulation in the CAM sessional that January.'
