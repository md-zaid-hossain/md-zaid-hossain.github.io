# Pages CMS (https://pagescms.org): the browser editor for this site.
# Open app.pagescms.org, sign in with GitHub, pick this repository: these forms appear.
# Saving commits the change; GitHub Actions then rebuilds and publishes the site in about 2 minutes.
# Made by tools/make_pages_yml.py from content/*.yml (every key has a field, hidden ones are ids the build needs).
# Education and routines are not in the editor: their shape is too nested for forms. Change them through Claude or by hand.
media:
  input: media
  output: media
content:
- name: projects
  label: Projects
  type: collection
  path: content/projects
