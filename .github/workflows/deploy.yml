# Build and publish the site on every push to main (GitHub Pages, source: GitHub Actions).
# Pictures, clips, fonts and CSS are served by jsDelivr (much faster in Bangladesh than github.io). jsDelivr serves a
# repository commit only while it is under 50 MB, so build/cdn_publish.py puts those files on small cdn-* branches.
name: Build and publish
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: on 26.04 Playwright cannot install its system fonts (21 Nov 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pyyaml pillow playwright && python -m playwright install --with-deps chromium
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/cache@v4                     # picture copies from the last run, so only new ones are made
        with:
          path: |
            media/_avif
            media/_thumbs
          key: webcopies-${{ github.run_id }}
          restore-keys: webcopies-
      - run: python build/cdn_publish.py --restore  # if the cache is empty: earlier copies from the cdn branches
      - run: python build/web_copies.py -q        # 800 px copies, AVIF copies, first frames of the 3D sprites
      - run: python checks/content_check.py       # privacy and text rules on content/*.yml, missing media files
      - run: python build/build.py                # content/*.yml + media/ -> dist/ (22 pages, sitemap, 404)
      - run: python build/cdn_publish.py          # files to the cdn-* branches, pages point at their commits
      - run: python checks/dashinv.py dist        # no em or en dash in visible text
      - run: python checks/widths.py dist         # 320 to 1920 px, dark and light: no sideways scrolling, no script errors
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
