# Build and publish the site on every push to main (GitHub Pages, source: GitHub Actions).
# Pictures, fonts and CSS are served by jsDelivr from this repository (much faster in Bangladesh than github.io),
# so new picture copies and CSS files are committed back first, and the pages point at that commit.
name: Build and publish
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: on 26.04 Playwright cannot install its system fonts (21 Nov 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pyyaml pillow playwright && python -m playwright install --with-deps chromium
      - run: python build/web_copies.py -q        # 800 px copies, AVIF copies, first frames of the 3D sprites
      - run: python checks/content_check.py       # privacy and text rules on content/*.yml, missing media files
      - run: python build/build.py                # content/*.yml + media/ -> dist/ (22 pages, sitemap, 404)
      - name: Commit the new picture copies and CSS (the CDN serves them from this commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/_thumbs media/_avif build/assets/css
          if ! git diff --cached --quiet; then
            git commit -m "Web copies of pictures and page CSS [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: grep -rl "__SHA__" dist | xargs -r sed -i "s/__SHA__/${SHA}/g"
      - run: python checks/dashinv.py dist        # no em or en dash in visible text
      - run: python checks/widths.py dist         # 320 to 1920 px, dark and light: no sideways scrolling, no script errors
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-24.04   # pinned: on 26.04 Playwright cannot install its system fonts (21 Nov 2026)
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
